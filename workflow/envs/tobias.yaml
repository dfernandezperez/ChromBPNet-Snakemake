name: TOBIAS_ENV

channels:
  - conda-forge
  - bioconda

dependencies:
  # Pre-built bioconda package. Installing TOBIAS with pip builds it from source, which fails
  # with recent setuptools/pip. 0.17.x supports matplotlib>=3.8 and PyPDF2 3.x, so the old
  # matplotlib<3.8 / pypdf2<3.0 / adjustText<0.8 pins are no longer needed.
  - tobias=0.17.5
