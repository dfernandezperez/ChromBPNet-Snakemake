# ---  Location of configuration files and input. This MUST NOT be modified. ---
resources: config/resources.yaml
sample_sheet: config/samples.tsv

# --- General Settings ---
# Main output directory. Everything that is not pipeline code/configuration is stored here:
# results, logs, downloaded reference data (data/), singularity images, conda envs and the
# snakemake metadata (.snakemake/). Use a location with enough space (e.g. /scratch).
output_dir: "/scratch/qscd/dfernandezp/chrombpnet"
host_tmp_dir: "tmpdir" # Define the HOST path for temporary files. It will be created inside the out_dir path

# --- Reference Genome & Annotations ---
genome_build: "mm10" # Genome version available at UCSC goldenPath (see below `genome_fasta_url_template`)
# Blacklist regions. This pipeline contains v2 blacklist regions (https://github.com/Boyle-Lab/Blacklist)
# Included genomes: ce10, ce11, dm3, dm6, hg19, hg38, mm9, mm10
# If your genome is not in the previous list, you must specify the path to a custom blacklist file below
# Pipeline expects to be gzipped
custom_blacklist: "" 

# Note: Use hgdownload.cse.ucsc.edu for human builds like hg38 if .soe doesn't work
genome_fasta_url_template: "http://hgdownload.soe.ucsc.edu/goldenPath/{genome_build}/bigZips/{genome_build}.fa.gz"
chrom_sizes_url: "http://hgdownload.soe.ucsc.edu/goldenPath/{genome_build}/bigZips/{genome_build}.chrom.sizes"
motif_file_url: "https://jaspar.elixir.no/download/data/2024/CORE/JASPAR2024_CORE_vertebrates_non-redundant_pfms_jaspar.txt" # has to be in JASPAR or MEME format

# --- Chromosome Splits ---
# Directory containing fold_0.json, fold_1.json, ..., fold_4.json (pre-made for mm10).
# Set to "" to generate the fold files with `chrombpnet prep splits` from `chr_splits` below
# (needed for other genomes).
splits_dir: "config/chr_splits"
chr_splits:
  canonical_chroms_regex: "^chr([0-9]+|X|Y)$" # Chromosomes kept for train/valid/test. Peaks on other chromosomes (chrM, unplaced contigs) are also removed before the top-N selection
  folds: # test/valid chromosomes per fold; all other canonical chromosomes are used for training
    0: {test: [chr1, chr3, chr6], valid: [chr8, chr19]}
    1: {test: [chr2, chr8, chr9, chr16], valid: [chr12, chr17]}
    2: {test: [chr4, chr11, chr12, chr15, chrY], valid: [chr7, chr18]}
    3: {test: [chr5, chr10, chr14, chr18, chr19, chr13], valid: [chr6, chr17]}
    4: {test: [chr7, chr13, chr17, chr19, chr15, chrX], valid: [chr10, chr18]}
# folds: ["0", "1", "2", "3", "4"] # Corresponds to filenames like fold_0.json
folds: ["0"] # Corresponds to filenames like fold_0.json

# --- Tool Parameters ---
# MACS3 Parameters (adjust as needed)
macs3:
  macs3_gsize: "mm" # Mouse genome size estimate for MACS3
  macs3_pvalue: 0.01
  macs3_format: "BAMPE" # Or BAM if single-end
  model_params: "--nolambda --nomodel --shift -75 --extsize 150" # Model related parameters
  other_params: "--keep-dup all --call-summits" # Any other parameters you want to add

# Keep the top N macs3 peaks by pvalue after blacklist region filt (chromBPNet paper uses 200k)
macs3_top_n_peaks: 200000

# ChromBPNet Preprocessing Parameters
chromnpnet_bias:
  peak_blacklist_extension: 1057 # DON'T CHANGE. This is based on the ChromBPNet Input size (2114bp). Change only if the tool updates it.
  bias_thresh_factor: 0.5 #  A threshold is applied on maximum count of non-peak region for training bias model, which is set as this threshold x min(count over peakregions). Recommended start value 0.5 for ATAC and 0.8 for DNase.
  assay_type: "ATAC" # Or "DNASE"
  extra_params: "" # Extra parameters for bias model

# ChromBPNet Training Parameters (Defaults from tutorial, adjust as needed)
chromnpnet_model:
  assay_type: "ATAC" # Or "DNASE"
  extra_params: "" # Extra parameters for bias model

# Contribution scores (chrombpnet DeepSHAP) for all peaks of each sample and fold.
# The peaks are shuffled (fixed seed, same order for every fold) and split into `n_chunks` GPU jobs
# that can run in parallel on different GPUs (~165 regions/min per RTX 3090, so 20 chunks of 200k
# peaks take ~1 h each); the chunks are merged afterwards. Each job runs `procs_per_gpu` DeepSHAP
# processes on its GPU: 2 is ~1.2x faster than 1, more saturate the GPU (and 5 run out of its memory).
# Changing n_chunks or shuffle_seed recomputes all the contribution scores.
contribs:
  n_chunks: 20
  procs_per_gpu: 2
  shuffle_seed: 1234
  keep_chunks: false # Keep the per-chunk h5 files (otherwise they are deleted once merged)

# TF-MoDISco run on each fold's contribution scores for the QC report of the chrombpnet models
# (same settings as `chrombpnet pipeline`, on a random subset of the fold's peaks)
qc_modisco:
  n_regions: 30000
  seqlets: 50000
  window: 500

# Modisco Parameters (adjust as needed). This meme database 
# is located in the singularity image of chromBPnet.
modisco_tf:
  meme_db: "/scratch/chrombpnet/chrombpnet/data/motifs.meme.txt"
  seqlets: 200000 # Number of max seqlets
  tomtom_n_match: 3 # Number of motifs to match by TOMTOM
  window: 500 # Window (bp) around the peak center used for seqlets (ChromBPNet uses 500)

# Marginal footprinting of motifs inserted into non-peak regions (chrombpnet footprints).
# TSV without header: motif name and the motif sequence to insert. The default file is
# located in the singularity image of chromBPnet (also motif_to_pwm.ATAC.tsv / .DNASE.tsv for Tn5/DNase bias motifs).
footprints:
  motifs_to_pwm: "/scratch/chrombpnet/chrombpnet/data/motif_to_pwm.TF.tsv"

# Motif instances (hits) of each sample's TF-MoDISco motifs in its fold-averaged contribution scores
# (Fi-NeMo, https://github.com/kundajelab/Fi-NeMo).
finemo:
  region_width: 1000 # Region around each peak summit where hits are called
  call_hits_params: "" # Extra parameters for `finemo call-hits` (e.g. "-l 0.7" sets the hit sparsity)

# Bindetect extra parameters
bindetect: ""

# --- Docker Images ---
# Pinned to a digest (currently the same image as the `latest` tag): some rules call chrombpnet's
# internal modules and report generators, which could change in a new release.
chrombpnet_container: "docker://kundajelab/chrombpnet@sha256:6f41e0f59fc025285645e2cbfd1bb6347431b4e0ab6088804d11843cd6aed169"
macs3_container: "docker://quay.io/biocontainers/macs3:3.0.3--py39h0699b22_0"
utils_container: "docker://quay.io/biocontainers/bedtools:2.31.1--h13024bc_3" # Example, might need ucsc-wiggletools or similar