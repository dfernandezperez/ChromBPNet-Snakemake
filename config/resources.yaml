# resources.yaml
# Resource configuration for the ChromBPNet Snakemake pipeline
# Runtime is specified in minutes.
# mem_mb is specified in megabytes (GB * 1000).
# cpu specifies the number of cores (adjust based on tool capabilities and cluster policy).
# retries specifies how many times a job should be resubmitted on failure (useful for transient issues).
#
# GPU rules: `gres` requests an RTX 3090 for TensorFlow (2.8 in the chrombpnet image is not safe on
# the 4090/H200 nodes) and any GPU for PyTorch (bpnet-lite contribs, Fi-NeMo), which adds the H200 and
# 4090 nodes of spot_gpu. `slurm_partition` is either a partition name or
#   main: always gpu_routing.main_partition (model training: long jobs that should not be preempted)
#   auto: main_partition while you have < gpu_lane_limit jobs there, otherwise overflow_partition
#         (preemptible: jobs are requeued and restart; retries after a failure go to main_partition)
# The 3090 nodes have 32 CPUs for 6-7 GPUs, so GPU jobs request at most 5 CPUs.
gpu_routing:
  enabled: true
  main_partition: irb_gpu_3090 # 2 GPUs per user at a time (QOS gpulimits)
  overflow_partition: spot_gpu # No GPU limit, preemptible
  gpu_lane_limit: 2
  squeue_ttl_seconds: 15
  claim_ttl_seconds: 300

